{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Sign In - Everything Soil{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="p-5 glass-card">
                <h2 class="text-center text-white mb-4 fw-bold">Sign In</h2>
                
                <form method="POST" action="{% url 'account_login' %}">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger bg-dark border-danger text-white mb-3">
                            Please check your email and password.
                        </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="id_login" class="form-label text-muted">Email address</label>
                        <input type="email" name="login" id="id_login" class="form-control bg-dark text-white border-secondary" placeholder="email@example.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="gradient-button w-100 py-2.5 mb-3">Sign In with Email</button>
                </form>
                
                <div class="text-center text-muted my-3 small">— OR —</div>
                
                <a href="{% provider_login_url 'google' %}" class="btn btn-outline-light w-100 py-2 border-secondary d-flex align-items-center justify-content-center mb-4" style="border-radius: 8px;">
                    <svg class="me-2" width="18" height="18" viewBox="0 0 18 18">
                        <path fill="#EA4335" d="M9 3.6c1.6 0 3 .6 4.1 1.6l3-3C14.3.9 11.8 0 9 0 5.5 0 2.5 2 1 5l3.2 2.5C5 5 6.8 3.6 9 3.6z"/>
                        <path fill="#4285F4" d="M17.8 9.2c0-.6 0-1.2-.1-1.8H9v3.5h5c-.2 1.1-.8 2-1.8 2.6l2.8 2.2c1.7-1.6 2.8-4 2.8-6.5z"/>
                        <path fill="#FBBC05" d="M4.2 10.7c-.2-.6-.3-1.2-.3-1.7s.1-1.1.3-1.7L1 4.8C.4 6 .1 7.4.1 9c0 1.6.3 3 .9 4.2l3.2-2.5z"/>
                        <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.8-2.2c-.8.5-1.9.8-3.2.8-2.2 0-4-1.4-4.8-3.9L1 13c1.5 3 4.5 5 8 5z"/>
                    </svg>
                    Continue with Google
                </a>

                <div class="text-center text-muted small">
                    Don't have an account? <a href="{% url 'account_signup' %}" class="text-success text-decoration-none fw-bold">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
