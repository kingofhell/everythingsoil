{% extends 'base.html' %}

{% block title %}Sign Out - Everything Soil{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="p-5 glass-card text-center">
                <h2 class="text-white mb-4 fw-bold">Sign Out</h2>
                <p class="text-muted mb-4">Are you sure you want to sign out of Everything Soil?</p>
                <form method="POST" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="gradient-button w-100 py-2.5 mb-2">Sign Out</button>
                    <a href="{% url 'soil:home' %}" class="btn btn-outline-secondary w-100 py-2 border-secondary" style="border-radius: 8px;">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
